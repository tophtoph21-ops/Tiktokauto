<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AutoContent Studio</title><meta name="theme-color" content="#12131a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><div><h1>AutoContent Studio</h1><p>Créer, valider, publier.</p></div><div id="connection"></div></header><main>
<section class="card mode-card"><h2>Que veux-tu créer ?</h2><div class="mode-switch"><button id="modeProduct" class="mode-choice active">🛍️ Produit</button><button id="modeViral" class="mode-choice">🎬 Viral 1 min+</button></div><div id="viralOptions" class="viral-options hidden"><label>Style<select id="viralStyle"><option value="random">🎲 Surprise-moi</option><option value="curiosite">🤯 Fait surprenant</option><option value="mystere">🕵️ Petit mystère</option><option value="quiz">🧠 Quiz</option><option value="histoire">📖 Mini-histoire</option><option value="top">🔥 Top 5</option><option value="science">🔬 Science facile</option><option value="psychologie">🧩 Psychologie</option><option value="scenario">🌪️ Et si… ?</option></select></label><label>Sujet facultatif<input id="viralTopic" placeholder="Laisse vide : l'app choisit"></label></div><button id="autopilot" class="primary bigbtn">Créer</button></section>
<section class="card trend-card"><div class="row-between"><div><h2>📡 Tendances</h2><p class="muted">Mises à jour automatiquement.</p></div><button id="refreshTrends">Actualiser</button></div><div id="trendChips" class="trend-chips"></div></section>
<section class="kpis" id="kpis"></section>
<section class="card"><div class="sectionhead"><div><h2>Vidéos</h2><p class="muted">Regarde, valide ou supprime.</p></div><button id="refresh">Actualiser</button></div><div id="contentList"></div></section>
<section class="card"><div class="sectionhead"><h2>Produits</h2><button id="toggleProduct">+ Ajouter</button></div><div id="productFormWrap" class="hidden"><form id="productForm"><label>Nom<input name="name" required></label><div class="row"><label>Prix<input name="price" type="number" step=".01"></label><label>Commission %<input name="commission_rate" type="number" step=".1"></label></div><label>Catégorie<input name="category"></label><label>Lien affilié<input name="affiliate_url"></label><label>Caractéristiques vérifiées<input name="notes"></label><label>Image<input name="image" type="file" accept="image/*"></label><button class="primary">Ajouter</button></form></div><div id="productList"></div></section>
<section class="settings-panel" id="settingsPanel"><div class="settings-shell"><div class="settings-title"><h2>⚙️ Réglages</h2><button id="closeSettings" class="iconbtn">✕</button></div><div class="card"><h3>Automatique</h3><label>Création quotidienne<select id="auto_content_mode"><option value="mix">Mix Produit / Viral</option><option value="viral">Viral uniquement</option><option value="product">Produit uniquement</option></select></label><label>Heure<input id="autopilot_hour" type="number" min="0" max="23"></label><label class="check"><input id="autopilot_enabled" type="checkbox"> Créer automatiquement chaque jour</label><button id="saveSettings">Enregistrer</button></div><div class="card"><h3>Connexions</h3><div id="setupStatus"></div><label class="check"><input id="zero_cost_mode" type="checkbox" checked> Mode 0 €</label><label class="check"><input id="trend_radar_enabled" type="checkbox" checked> Radar tendances</label><label class="check"><input id="agnes_enabled" type="checkbox" checked> Agnes AI</label><label>Clé Agnes<input id="AGNES_API_KEY" type="password" placeholder="Laisser vide pour conserver"></label><button id="testAgnes">Tester Agnes</button><label>Clé TikTok<input id="TIKTOK_CLIENT_KEY"></label><label>Secret TikTok<input id="TIKTOK_CLIENT_SECRET" type="password"></label><label>Adresse de retour<input id="TIKTOK_REDIRECT_URI"></label><label>Autorisations<input id="TIKTOK_SCOPES"></label><button id="saveSetup" class="primary">Enregistrer</button><button id="testSetup">Tester l'app</button></div></div></section>
</main><nav class="bottomnav"><button data-go="top">Accueil</button><button data-go="contentList">Vidéos</button><button data-go="productList">Produits</button><button id="openSettings">⚙️</button></nav><footer><a href="/terms">Conditions</a> · <a href="/privacy">Confidentialité</a></footer><div id="toast"></div><script src="/app.js"></script></body></html>
